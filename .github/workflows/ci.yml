name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-check:
    name: Terraform fmt / validate / plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: terraform fmt (check only)
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, no plan against real state)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Detect AWS credentials
        id: creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: echo "has_aws=${{ secrets.AWS_ACCESS_KEY_ID != '' }}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: steps.creds.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: terraform plan (real plan, only runs with AWS secrets configured)
        if: steps.creds.outputs.has_aws == 'true'
        run: |
          terraform init
          terraform plan -input=false \
            -var="admin_cidr=${{ secrets.ADMIN_CIDR }}" \
            -var="ssh_key_name=${{ secrets.SSH_KEY_NAME }}"

      - name: Skip notice
        if: steps.creds.outputs.has_aws != 'true'
        run: echo "No AWS secrets configured on this repo - skipping real terraform plan. fmt/validate above still gate the PR."

  ansible-check:
    name: ansible-lint + syntax check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible + ansible-lint
        run: pip install "ansible-core>=2.16" "ansible-lint>=24.2"

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: ansible-lint
        run: ansible-lint playbooks/site.yml

      - name: Syntax check against example inventory
        run: |
          cp inventory/hosts.ini.example inventory/hosts.ini
          ansible-playbook playbooks/site.yml --syntax-check
