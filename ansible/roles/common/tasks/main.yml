---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade all packages to latest
  ansible.builtin.apt:
    upgrade: dist

- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - curl
      - vim
      - htop
      - unzip
      - ufw
      - python3
      - python3-pip
      - unattended-upgrades
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ fleet_timezone }}"

- name: Create dedicated service group
  ansible.builtin.group:
    name: "{{ service_user }}"
    system: true
    state: present

- name: Create dedicated service user (no login shell, no password)
  ansible.builtin.user:
    name: "{{ service_user }}"
    group: "{{ service_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Enable unattended security upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/51unattended-upgrades-fleet
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"

- name: Enable UFW, default deny incoming
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow node_exporter through UFW (fleet-internal, SG already restricts this)
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
