---
- name: Create prometheus system group
  ansible.builtin.group:
    name: prometheus
    system: true
    state: present

- name: Create prometheus system user
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present

- name: Create prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0755"
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Check installed prometheus version
  ansible.builtin.command:
    cmd: /usr/local/bin/prometheus --version
  register: monitoring_server_prometheus_installed
  failed_when: false
  changed_when: false

- name: Download prometheus release
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    mode: "0644"
  when: prometheus_version not in (monitoring_server_prometheus_installed.stderr | default('') + monitoring_server_prometheus_installed.stdout | default(''))

- name: Extract prometheus release
  ansible.builtin.unarchive:
    src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: prometheus_version not in (monitoring_server_prometheus_installed.stderr | default('') + monitoring_server_prometheus_installed.stdout | default(''))

- name: Install prometheus + promtool binaries
  ansible.builtin.copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    remote_src: true
  loop:
    - prometheus
    - promtool
  when: prometheus_version not in (monitoring_server_prometheus_installed.stderr | default('') + monitoring_server_prometheus_installed.stdout | default(''))
  notify: Restart prometheus

- name: Deploy prometheus.yml scrape config (fleet-wide targets)
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
  notify: Restart prometheus

- name: Deploy prometheus systemd unit
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: "0644"
  notify: Restart prometheus

- name: Enable and start prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true

- name: Add Grafana apt key
  ansible.builtin.apt_key:
    url: "{{ grafana_apt_key_url }}"
    state: present

- name: Add Grafana apt repo
  ansible.builtin.apt_repository:
    repo: "deb https://apt.grafana.com stable main"
    state: present
    filename: grafana

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true

- name: Deploy Grafana Prometheus datasource provisioning
  ansible.builtin.copy:
    src: grafana-datasource.yml
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    mode: "0644"
  notify: Restart grafana

- name: Deploy Grafana dashboard provisioning config
  ansible.builtin.copy:
    src: grafana-dashboards.yml
    dest: /etc/grafana/provisioning/dashboards/fleet.yml
    mode: "0644"
  notify: Restart grafana

- name: Create Grafana dashboards directory
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Copy fleet health dashboard JSON
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../monitoring/grafana/dashboards/fleet-health.json"
    dest: /var/lib/grafana/dashboards/fleet-health.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: Restart grafana

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
