---
- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -T -f %s
  notify: Restart sshd

- name: Ensure ssh key directory permissions are correct for ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.ssh
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Flush handlers so sshd restarts before any later connection check
  meta: flush_handlers
